name: ai-seed-studio
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_seed_studio}
      POSTGRES_USER: ${POSTGRES_USER:-seed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init-env.ps1 first}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    env_file: .env
    environment:
      LOCAL_STORAGE_PATH: /app/storage
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-seed}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ai_seed_studio}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend
volumes:
  postgres_data:
